name: Deploy CIT site to Azure Static Web Apps

# Static brochure site — no build step. Deploys repo root to the Azure SWA.
# Live domain stays on GitHub Pages until DNS cutover (Stage B); this only
# publishes to the *.azurestaticapps.net default host for verification.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

jobs:
  build_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          action: ${{ (github.event_name == 'pull_request' && github.event.action == 'closed') && 'close' || 'upload' }}
          app_location: "/"      # index.html + assets/ live at repo root
          skip_app_build: true   # pure static, no build
